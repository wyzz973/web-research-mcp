name: Release
# Runs when a version tag is pushed, for example:
#   git tag v2.0.0-alpha.1 && git push origin v2.0.0-alpha.1
# It re-runs every check, then attaches the packed tarball to a GitHub release, so that the tool
# installs with one command and without a build:
#   npm install -g https://github.com/wyzz973/web-research-mcp/releases/download/<tag>/<file>.tgz
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          version: 10.12.3
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: The tag must match the package version
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: pnpm check
      - run: pnpm build
      - run: node scripts/pack-smoke.mjs
      - run: npm pack
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags="--generate-notes"
          case "$GITHUB_REF_NAME" in *-*) flags="$flags --prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" ./*.tgz $flags
